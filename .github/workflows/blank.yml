name: Auto Update YouTube Feed

on:
  schedule:
    # jalan tiap 3 jam. Sesuaikan sesuai kebutuhan (format cron UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # tombol "Run workflow" manual di tab Actions
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate halaman dari YouTube feed
        env:
          YT_CHANNEL_ID: "UCX3eUzYV2LN5JmZPXULQM5Q"
          # GANTI dengan URL GitHub Pages kamu, contoh:
          # https://username.github.io/nama-repo
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: "BePrMj3WB0aTaCf_yKPG1JXTUx5j9bbZexsDrLQSkjU"
        run: python3 scripts/generate.py

      - name: Commit & push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan video baru."
          else
            git commit -m "chore: auto-update feed video YouTube [skip ci]"
            # tarik & rebase dulu supaya tidak bentrok kalau ada commit baru di remote
            git pull --rebase origin main
            git push origin main
          fi

  deploy-pages:
    needs: update-feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo (ambil versi terbaru setelah commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
